# Builds the universal .app on GitHub's macOS runners and attaches the zip to a Release.
#
#   To publish a release:   git tag v1.0.0 && git push --tags
#   Or run it manually from the Actions tab (workflow_dispatch) to get the zip as an artifact.
name: Build macOS app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build universal app + zip
        run: ./build.sh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DesmosDesktop-mac
          path: DesmosDesktop-mac.zip

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: DesmosDesktop-mac.zip
          generate_release_notes: true
